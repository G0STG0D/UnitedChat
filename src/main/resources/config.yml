    - '    <red>There are currently <white>%server_online% <red>players online.'
    - '<gradient:#ffffff:#ff5555>------------------------------</gradient>'
  first-join-motd:
    - '<gradient:#ffffff:#ff5555>------------------------------</gradient>'
    - '                     <red><bold>UNITED<white><bold>LANDS     '
    - '             <red>Welcome to <red><bold>United<white><bold>Lands <yellow><italic>%player_name%&c!'
    - '    <red>There are currently <white>%server_online% <red>players online.'
    - '<gradient:#ffffff:#ff5555>------------------------------</gradient>'

  # +---------------------------------------------+ #
  # |            Gradient Messages                | #
  # +---------------------------------------------+ #

  gradient-changed: <green>Gradient changed.
  gradient-on: <green>Gradient enabled.
  gradient-command: <yellow>Use /gradient [toggle] | [preset] | [hexcolor1] [hexcolor2] %player_name%
  gradient-set-command: <yellow>Please provide a preset name or a custom hex color gradient (#RRGGBB:#RRGGBB:#RRGGBB...)
  gradient-admin-command: <yellow>Use /gradient [toggle] | [preset] | [hexcolor1] [hexcolor] |[player]
