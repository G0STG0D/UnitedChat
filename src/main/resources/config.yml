###################################################
# +---------------------------------------------+ #
# |               Chat Features                 | #
# +---------------------------------------------+ #
###################################################

# Options for toggling on or off.

features:
  - tabprefix
  - tabnation
  - tabtown
  - quiz

###################################################
# +---------------------------------------------+ #
# |                   Quiz                      | #
# +---------------------------------------------+ #
###################################################

quiz:
  # Can be enabled/disabled via /uc quiz toggle on/off
  enabled: false
  # Time (in minutes) between each quiz question.
  interval: 10
  # Minimum number of players online for a quiz question to be asked.
  min-players: 2
  # Days before a question becomes eligible again.
  cooldown-days: 30
  # Reward (in money) for answering a quiz question correctly.
  payout: 500
  # Sound when a quiz question is asked.
  sound:
    name: "minecraft:entity.experience_orb.pickup"
    volume: 1.0
    pitch: 1.0
  header: "\n\n<red><st>+|✦                      </st><bold>[ <white>❓ Quiz</white> ]</bold><st>                     |✦+</st></red>\n"
  footer: "\n<red><st>+|✦</st><st>                          +✦+                          </st><st>|✦+</st></red>\n\n"
  answer-prompt: "<gray><italic>              ✎ Type your answer in chat!</italic></gray>"
  # Available placeholders: %letter%, %choice%
  choice-format: "  <yellow>%letter%</yellow> <white>%choice%</white>"
  # How many characters per line before the text wraps to the next line.
  word-wrap-length: 49
  bossbar-title: "<yellow>❓ Quiz</yellow>"
  # How long (in seconds) players have to answer before time runs out.
  answer-timeout: 15
  # Cooldown (in seconds) between multiple-choice attempts per player (prevents A/B/C/D spam).
  mc-attempt-cooldown: 8
  # Available placeholders: %bar%
  cooldown-bar: "<gray>Answer available in: </gray>%bar%"
  cooldown-ready: "<green>✔ Answer available!</green>"
  # Sound when a quiz question ends.
  end-sound:
    name: "minecraft:entity.player.levelup"
    volume: 1.0
    pitch: 1.2
  # Available placeholders: %player%, %answer%
  correct-announcement: "\n<green>✔ <bold>%player%</bold> answered correctly! The answer was <bold>%answer%</bold>.</green>\n"
  timeout-announcement: "\n<red>✖ Time's up! Nobody answered correctly. The answer was <bold>%answer%</bold>.</red>\n"
  # Available placeholders: %name%, %answer%, %question%
  discord-announcement: "**%name%** has correctly answered **%answer%** to the question:\\n> *%question%*"
  discord-webhook-url: "<WEBHOOK_URL_HERE>"
  no-questions: "<red>No quiz questions are currently available. Please contact the owner.</red>"
  # Available placeholders: %word%
  word-scramble-prompt: "Unscramble this word: <yellow><bold>%word%</bold></yellow>"
  # Available placeholders: %formula%
  math-prompt: "What is <yellow><bold>%formula%</bold></yellow> ?"
  highscore:
    # Available placeholders: %rank%, %name%, %wins%, %wins_label%
    header: "\n<gold><bold>⭐ Quiz Highscore — %period%</bold></gold>"
    entry: " <gray>#%rank%</gray> <white><bold>%name%</bold></white> <dark_gray>—</dark_gray> <yellow>%wins% %wins_label%</yellow>"
    # Available placeholders: <prev>, <next>, %page%, %total%
    page-nav: "\n<prev><gray>    Page %page%/%total%    </gray><next>"
    empty: "<gray> No entries yet."
    wins-singular: "win"
    wins-plural: "wins"
    page-size: 10
  # Probability weights (in %) for each question type
  type-weights:
    multiple-choice: 40
    open-text: 40
    math-formula: 10
    word-scramble: 10
  # When a multiple-choice or open-text question is picked, how likely (%) is it to be UL-specific
  ul-weights:
    multiple-choice: 75
    open-text: 75
  # TownyChat channels in which quiz answers are accepted
  channels:
    - general

###################################################
# +---------------------------------------------+ #
# |             Auto-Broadcaster                | #
# +---------------------------------------------+ #
###################################################

broadcaster:
  # Time (in minutes) between each broadcast.
  interval: 15
  # Play a sound effect.
  # Invalid or empty "" names will play no sound.
  sound:
