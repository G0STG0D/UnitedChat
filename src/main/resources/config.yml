  dragonfruit: "#ff2c2c:#ff005d:#ff008f:#ff2dc3:#ff57f5"
  jshine: "#12c2e9:#c471ed:#f64f59"
  eveningsunshine: "#b92b27:#1565C0"
  metapolis: "#659999:#f4791f"
  kyoopal: "#dd3e54:#6be585"
  kyemeh: "#8360c3:#2ebf91"
  wiretap: "#8A2387:#E94057:#F27121"
  magic: "#59C173:#a17fe0:#5D26C1"
  redsunset: "#355C7D:#6C5B7B:#C06C84"

###################################################
# +---------------------------------------------+ #
# |                  Messages                   | #
# +---------------------------------------------+ #
###################################################

# System messages

messages:
  prefix: '<bold><red>U</red><white>L</white></bold> Chat <dark_gray>» '
  payout-message: '<gray>You have received <bold><gold><amount></gold></bold> for answering the quiz question correctly!</gray>'
  chat-toggle-command: '<yellow>Use /chat [Chat Feature] on/off'
  reloaded: '<green>Config reloaded.'
  toggled-feature: '<grey><feature> successfully set to <b><toggle></b>!</grey>'
  invalid-feature: '<red>Invalid feature.'
  quiz-forced: '<yellow>Quiz question forced.'
  quiz-toggled: '<yellow>Quizzes has been <toggle>.'
  quiz-next: '<gray>Next quiz in <yellow><bold><time></bold>.</gray>'
  quiz-next-active: '<gray>A quiz is currently active!'
  quiz-next-disabled: '<red>Quizzes are currently disabled.'
  quiz-next-not-running: '<red>Not enough players online for a quiz to be started.'
  reset: '<green>UnitedChat settings reset.'
  no-perm: '<red>You don''t have permission to use this command.'

  # +---------------------------------------------+ #
  # |               Join Messages                 | #
  # +---------------------------------------------+ #

  motd:
    - '<gradient:#ffffff:#ff5555>------------------------------</gradient>'
    - '                     <bold><red>UNITED</red><white>LANDS</white></bold>'
